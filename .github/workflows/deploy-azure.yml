name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py

      - name: Smoke-test API
        shell: bash
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "The API did not become ready in time."
          exit 1

      - name: Build deployment package
        shell: bash
        run: |
          mkdir -p deployment/.python_packages/lib/site-packages
          cp main.py requirements.txt deployment/
          python -m pip install \
            --requirement requirements.txt \
            --target deployment/.python_packages/lib/site-packages

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: deployment
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: deployment

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deployment
          startup-command: PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages python -m uvicorn main:app --host 0.0.0.0 --port 8000
