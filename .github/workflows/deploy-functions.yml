name: Deploy reminder functions

on:
  push:
    branches: [main, dev]
    paths:
      - "push_function/**"
      - "rag.py"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push_function
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      RESOURCE_GROUP: language-learning-ai-rg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install function dependencies into package
        run: python -m pip install --target push_function/.python_packages/lib/site-packages -r push_function/requirements.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create deployment package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("push_function")
          with ZipFile("released-package.zip", "w", ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PY
      - name: Deploy package to Flex Consumption Function App
        env:
          FUNCTION_APP: ${{ github.ref_name == 'main' && vars.AZURE_FUNCTION_APP_NAME || vars.AZURE_DEV_FUNCTION_APP_NAME }}
          STORAGE_ACCOUNT: languageaistorageevth
        run: |
          storage_key=$(az storage account keys list --resource-group "$RESOURCE_GROUP" --account-name "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)
          container_name=$(echo "$FUNCTION_APP" | tr -d '-' | tr '[:upper:]' '[:lower:]')
          az storage container create --name "$container_name" --account-name "$STORAGE_ACCOUNT" --account-key "$storage_key" -o none
          az storage blob upload --account-name "$STORAGE_ACCOUNT" --account-key "$storage_key" \
            --container-name "$container_name" --name released-package.zip --file released-package.zip --overwrite -o none
          expiry=$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%MZ')
          sas=$(az storage blob generate-sas --account-name "$STORAGE_ACCOUNT" --account-key "$storage_key" \
            --container-name "$container_name" --name released-package.zip --permissions r --expiry "$expiry" -o tsv)
          subscription_id=$(az account show --query id -o tsv)
          package_uri="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${container_name}/released-package.zip?${sas}"
          az rest --method put \
            --url "https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${FUNCTION_APP}/extensions/onedeploy?api-version=2024-04-01" \
            --body "{\"properties\":{\"packageUri\":\"${package_uri}\",\"remoteBuild\":false}}" \
            --headers Content-Type=application/json
