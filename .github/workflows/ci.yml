name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py test_main.py

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test API
        shell: bash
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "The API did not become ready in time."
          exit 1
